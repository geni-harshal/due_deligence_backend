# ============================================================
# MINIO STORAGE CONFIGURATION
# ============================================================
minio:
  url: http://35.244.1.113:9000
  access-key: admin
  secret-key: password
  bucket: decision-model
  secure: false

# Upload directory for app
app:
  uploads:
    dir: uploads/deligence
# ============================================================
# SPRING BOOT CONFIGURATION
# ============================================================
spring:
  application:
    name: EntityCheck Backend
  
  # Profiles to include
  profiles:
    include:
      - comprehensive
  
  # ============================================================
  # DATABASE CONFIGURATION
  # ============================================================
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://35.244.1.113:5432/deligence_pro}
  #   username: ${DB_USER:adminuser}
  #   password: ${DB_PASSWORD:OYquG97b4OO91ffF}
  #   driver-class-name: org.postgresql.Driver
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deligence_pro}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  
  # ============================================================
  # JPA / HIBERNATE CONFIGURATION
  # Using JPA ddl-auto instead of Flyway for schema management
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ============================================================
  # FLYWAY DISABLED
  # ============================================================
  flyway:
    enabled: false

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on-param

# ============================================================
# SECURITY CONFIGURATION
# ============================================================
security:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-characters-long-for-hmac}
    expiration: ${JWT_EXPIRATION:86400000}

# ============================================================
# PYTHON MODEL CONFIGURATION
# ============================================================
python:
  model:
    url: ${PYTHON_MODEL_URL:http://35.244.1.113:8003/api/v1/credit-report/generate}
    # url: ${PYTHON_MODEL_URL:http://localhost:8000/api/v1/credit-report/generate}

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging:
  level:
    org.springframework.security: DEBUG
    com.entitycheck: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

pdf:
  service:
    url: http://localhost:3001/generate-pdf
    # url: http://35.244.1.113:3001/generate-pdf
  # storage:
  #   path: ${PDF_STORAGE_PATH:./storage/pdfs}
# ============================================================
# ACTUATOR & MONITORING
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
          
